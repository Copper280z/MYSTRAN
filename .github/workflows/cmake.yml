name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release

# ============================================================
# Shared build step that all test jobs depend on
# ============================================================
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Symlink gfortran
      run: |
        sudo ln -fs /usr/bin/gfortran-10 /usr/local/bin/gfortran
        sudo ln -fs /usr/bin/gcc-10 /usr/local/bin/gcc
        sudo ln -fs /usr/bin/g++-10 /usr/local/bin/g++

    - name: Configure
      run: cmake -G Ninja -Denable_internal_blaslib=yes -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} .

    - name: Build
      run: cmake --build .

    - name: Smoke test
      run: |
        Binaries/mystran Build_Test_Cases/statics/BAR-I12.DAT
        Binaries/mystran Build_Test_Cases/statics/cshear.bdf

    - name: Upload mystran binary
      uses: actions/upload-artifact@v4
      with:
        name: mystran-binary
        path: Binaries/mystran
        retention-days: 1

    - name: Upload unit test binaries
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-binaries
        path: tests/unit/test_*
        retention-days: 1

# ============================================================
# Unit tests — Fortran standalone programs via CTest
# ============================================================
  unit-tests:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Symlink gfortran
      run: |
        sudo ln -fs /usr/bin/gfortran-10 /usr/local/bin/gfortran
        sudo ln -fs /usr/bin/gcc-10 /usr/local/bin/gcc
        sudo ln -fs /usr/bin/g++-10 /usr/local/bin/g++

    - name: Configure
      run: cmake -G Ninja -Denable_internal_blaslib=yes -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} .

    - name: Build unit tests
      run: cmake --build . --target test_outer_product test_cross_product test_matmult

    - name: Run unit tests
      run: ctest -L unit -V --output-on-failure

# ============================================================
# E2E tests — run all cases and compare against analytical solutions
# ============================================================
  e2e-tests:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download mystran binary
      uses: actions/download-artifact@v4
      with:
        name: mystran-binary
        path: Binaries

    - name: Make binary executable
      run: chmod +x Binaries/mystran

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pyNastran
      run: pip install -r tests/e2e/requirements.txt

    - name: Run E2E tests
      run: python tests/e2e/runner.py Binaries/mystran tests/e2e_cases

# ============================================================
# Regression tests — compare current build against previous tag
# Only runs on pushes to main (not PRs) to avoid duplicate work
# and because it requires building two binaries.
# ============================================================
  regression:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history needed to find previous tag

    - name: Find previous git tag
      id: prev_tag
      run: |
        PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        echo "tag=${PREV}" >> "$GITHUB_OUTPUT"
        if [ -z "$PREV" ]; then
          echo "No previous tag found — skipping regression comparison."
        else
          echo "Previous tag: $PREV"
        fi

    - name: Symlink gfortran
      run: |
        sudo ln -fs /usr/bin/gfortran-10 /usr/local/bin/gfortran
        sudo ln -fs /usr/bin/gcc-10 /usr/local/bin/gcc
        sudo ln -fs /usr/bin/g++-10 /usr/local/bin/g++

    - name: Build current binary
      run: |
        cmake -G Ninja -Denable_internal_blaslib=yes -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} .
        cmake --build .
        cp Binaries/mystran /tmp/mystran_current

    - name: Build baseline binary (previous tag)
      if: steps.prev_tag.outputs.tag != ''
      run: |
        git stash
        git checkout ${{ steps.prev_tag.outputs.tag }}
        cmake -G Ninja -Denable_internal_blaslib=yes -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} .
        cmake --build .
        cp Binaries/mystran /tmp/mystran_baseline
        git checkout -

    - name: Clone MYSTRAN_Benchmark
      if: steps.prev_tag.outputs.tag != ''
      run: |
        git clone --depth=1 https://github.com/MYSTRANsolver/MYSTRAN_Benchmark.git /tmp/MYSTRAN_Benchmark

    - name: Download f06diff (latest release, Linux x86_64)
      if: steps.prev_tag.outputs.tag != ''
      run: |
        ASSET_URL=$(curl -s https://api.github.com/repos/ClassicalFEA/nastools/releases/latest \
          | python3 -c "
        import json,sys
        data = json.load(sys.stdin)
        assets = data.get('assets', [])
        for a in assets:
            if 'f06diff' in a['name'] and 'linux-musl' in a['name']:
                print(a['browser_download_url'])
                break
        ")
        if [ -z "$ASSET_URL" ]; then
          echo "ERROR: could not find f06diff Linux release asset"
          exit 1
        fi
        curl -L "$ASSET_URL" -o /tmp/f06diff.zip
        unzip /tmp/f06diff.zip -d /tmp/f06diff_bin
        F06DIFF=$(find /tmp/f06diff_bin -name "f06diff" -type f | head -1)
        chmod +x "$F06DIFF"
        cp "$F06DIFF" /tmp/f06diff

    - name: Run regression tests
      if: steps.prev_tag.outputs.tag != ''
      run: |
        python3 tests/regression/runner.py \
          --baseline /tmp/mystran_baseline \
          --current  /tmp/mystran_current \
          --f06diff  /tmp/f06diff \
          --decks-dir /tmp/MYSTRAN_Benchmark/Benchmark_Decks \
          --cases tests/regression/benchmark_cases.txt

    - name: Skip message (no previous tag)
      if: steps.prev_tag.outputs.tag == ''
      run: echo "Skipped — no previous release tag to compare against."
